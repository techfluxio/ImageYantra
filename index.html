<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="google-adsense-account" content="ca-pub-2178808063904703" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fallback meta — only used if a page somehow doesn't set its own via
       <Head> (see src/routes.jsx / each page component). Every real page
       overrides these with page-specific tags at build time. -->
  <title>ImageYantra — Free Online Image &amp; PDF Tools</title>
  <meta name="description" content="Free online image and PDF tools: compress, resize, crop, rotate, convert to PDF, merge PDFs, prepare exam documents — all in your browser. No upload. No signup." />

  <!-- Schema.org WebSite (site-wide, not page-specific) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "ImageYantra",
    "url": "https://imageyantra.in",
    "description": "Free online image, PDF, exam and government document tools",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://imageyantra.in/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Favicon -->
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="shortcut icon" href="/favicon.png" type="image/png" />

  <!-- Font preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2178808063904703" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
